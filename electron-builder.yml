appId: com.abapfy.app
productName: Abapfy
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/**
  - '!node_modules/**'
asarUnpack:
  - resources/**
win:
  executableName: abapfy
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  category: Development
npmRebuild: false
publish:
  provider: github
  owner: esc4n0rx
  repo: abapfyv2
  releaseType: release
